<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!--
      Theme is resolved before first paint to avoid a flash of the wrong ground.
      Mirrors the resolution order in src/lib/theme.tsx: stored choice wins,
      otherwise the OS preference decides and no attribute is written.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          if (stored === 'light' || stored === 'dark') {
            document.documentElement.setAttribute('data-theme', stored);
          }
        } catch (e) {
          /* private mode / blocked storage: fall through to the OS preference */
        }
      })();
    </script>

    <!--
      Fonts are self-hosted (see src/index.css). Only the three faces used above
      the fold are preloaded: the pixel face for headings, and the label and body
      faces. JetBrains Mono is deliberately not preloaded — it first appears in
      the metrics further down the page.
    -->
    <link
      rel="preload"
      href="/fonts/silkscreen-700.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/space-grotesk-var.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/manrope-var.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <title>Abdullah Khan Niazi — Full-Stack Developer, AI / Edge ML</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
